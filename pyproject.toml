[project]
name = "habittracker"
version = "0.1.0"
description = ""
authors = [
    {name = "StreetShiffter",email = "agwzdushaz@gmail.com"}
]
package-mode = false
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.2.7,<6.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.28.0,<0.29.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-celery-beat (>=2.8.1,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    #Если установили и нужен dockerfile то удалите эту строку совсем
    #и обновите poetry.lock: poetry lock, затем poetry show
#    "psycopg2 (>=2.9.11,<3.0.0)", используется только локально
    "dotenv (>=0.9.9,<0.10.0)",
    "ipython (>=9.6.0,<10.0.0)",
    "django-filter (>=25.2,<26.0)",
    "celery (>=5.5.3,<6.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "eventlet (>=0.40.3,<0.41.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
isort = "^7.0.0"
black = "^25.9.0"

